name: Pruebas del generador PDF
on:
  push:
    branches:
      - "repair/**"
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar motor PDF para pruebas reales
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils
      - name: Validar sintaxis
        run: python -m compileall -q app.py web_app.py interfaz.py generador.py utilidades.py test_generador.py
      - name: Pruebas unitarias
        run: python -m unittest discover -p "test_*.py" -v
